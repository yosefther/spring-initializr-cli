name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall main.py spring_initializr_cli

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI help (module)
        run: python -m spring_initializr_cli --help

      - name: CLI help (bash launcher)
        if: runner.os == 'Linux'
        run: |
          chmod +x bin/spring-init
          ./bin/spring-init --help

      - name: CLI help (cmd launcher)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\bin\spring-init.cmd --help
